packages:
  - apps/*
  - packages/*

# Explicit approval for the build tools used by this scaffold.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  sharp: false

# Archive supplies vectors explicitly. Do not install LanceDB's optional hosted
# embedding clients or local model runtimes in the base profile.
overrides:
  # Architect editor port: one instance of each CodeMirror package (see packages/architect).
  '@codemirror/commands': 6.11.0
  '@codemirror/lang-html': 6.4.12
  '@codemirror/lang-json': 6.0.2
  '@codemirror/lang-markdown': 6.5.2
  '@codemirror/language': 6.12.4
  '@codemirror/merge': 6.12.2
  '@codemirror/search': 6.7.1
  '@codemirror/state': 6.7.1
  '@codemirror/view': 6.43.9
  'prosemirror-view': 1.42.6
  prosemirror-model: 1.25.12
  katex: 0.19.0
  '@lancedb/lancedb@0.37.1>@huggingface/transformers': '-'
  '@lancedb/lancedb@0.37.1>openai': '-'

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261011.1'
